spring:
  application:
    name: blood-bridge
  profiles:
    active: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

bloodbridge:
  jwt:
    secret: BloodBridgeHciDemoSecretKeyMustBeLongEnoughForHs256Algorithm
    expiration-ms: 86400000
